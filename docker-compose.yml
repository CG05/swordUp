services:
  api:
    build: .
    container_name: blacksmith_api
    expose:
      - "8000"
    restart: always

  redis:
    image: redis:7
    container_name: blacksmith_redis
    restart: always

  nginx:
    image: nginx:latest
    container_name: blacksmith_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/ubuntu/swordUp/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/ubuntu/swordUp/certbot/www:/var/www/certbot
      - /home/ubuntu/swordUp/certbot/conf:/etc/letsencrypt

    depends_on:
      - api
    restart: always

  certbot:
    image: certbot/certbot:latest
    container_name: blacksmith_certbot
    volumes:
      - /home/ubuntu/swordUp/certbot/www:/var/www/certbot
      - /home/ubuntu/swordUp/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c
    command: "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    restart: always
