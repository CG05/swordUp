version: "3.9"

services:
  api:
    build: .
    container_name: blacksmith_api
    ports:
      - "443:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7
    container_name: blacksmith_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
